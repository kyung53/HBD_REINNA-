<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Guess The Song</title>

  <!-- ARCADE FONT -->
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{

      min-height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;

      padding:4vw;

      overflow-x:hidden;

      font-family:'VT323', monospace;

      color:white;

      position:relative;

      background:
      radial-gradient(circle at top, #2563eb 0%, #0f172a 55%, #020617 100%);
    }

    /* RETRO GRID */
    body::before{

      content:"";

      position:fixed;
      inset:0;

      background-image:
      linear-gradient(rgba(96,165,250,0.12) 1px, transparent 1px),
      linear-gradient(90deg, rgba(96,165,250,0.12) 1px, transparent 1px);

      background-size:40px 40px;

      z-index:0;
    }

    .container{

      position:relative;
      z-index:1;

      width:min(95vw, 850px);

      background:#071329;

      border:4px solid #60a5fa;

      padding:min(5vw, 40px);

      text-align:center;

      box-shadow:
      0 0 12px #60a5fa,
      0 0 35px rgba(96,165,250,0.7);
    }

    h1{

      font-size:clamp(2.5rem, 6vw, 5rem);

      color:#93c5fd;

      margin-bottom:15px;

      text-shadow:
      4px 4px #1d4ed8,
      0 0 18px rgba(147,197,253,0.9);
    }

    .round{

      font-size:clamp(1.3rem, 2vw, 1.8rem);

      margin-bottom:25px;

      color:#dbeafe;
    }

    .song-box{

      width:100%;

      padding:30px;

      border:3px solid #3b82f6;

      background:#0f172a;

      margin-bottom:30px;

      box-shadow:0 0 12px rgba(59,130,246,0.5);
    }

    .music-icon{

      font-size:clamp(4rem, 8vw, 7rem);

      animation:bounce 1.5s infinite;
    }

    @keyframes bounce{

      0%,100%{
        transform:translateY(0);
      }

      50%{
        transform:translateY(-10px);
      }
    }

    .timer{

      margin-top:20px;

      font-size:clamp(1.5rem, 2vw, 2rem);

      color:#60a5fa;
    }

    input{

      width:100%;

      padding:15px;

      border:none;
      outline:none;

      text-align:center;

      font-size:clamp(1.5rem, 3vw, 2rem);

      font-family:'VT323', monospace;

      background:#0f172a;

      color:white;

      border:3px solid #60a5fa;

      margin-bottom:20px;
    }

    button{

      padding:14px 35px;

      border:none;

      cursor:pointer;

      background:#2563eb;

      color:white;

      border:3px solid #93c5fd;

      font-family:'VT323', monospace;

      font-size:clamp(1.3rem, 2vw, 1.8rem);

      transition:0.25s;
    }

    button:hover{

      transform:scale(1.05);

      background:#3b82f6;
    }

    #playBtn{

      margin-bottom:20px;
    }

    .message{

      margin-top:20px;

      min-height:30px;

      font-size:clamp(1.3rem, 2vw, 1.8rem);

      color:#93c5fd;
    }

  </style>
</head>

<body>

  <div class="container">

    <h1>GUESS THE SONG</h1>

    <div class="round" id="roundText">
      ROUND 1 / 7
    </div>

    <div class="song-box">

      <div class="music-icon">
        🎵
      </div>

      <div class="timer" id="timer">
        PRESS PLAY
      </div>

    </div>

    <!-- PLAY BUTTON -->
    <button id="playBtn" onclick="playCurrentSong()">
      ▶ PLAY SONG
    </button>

    <br>

    <input
      type="text"
      id="answerInput"
      placeholder="TYPE THE SONG TITLE"
      autocomplete="off"
    >

    <button onclick="checkAnswer()">
      SUBMIT
    </button>

    <div class="message" id="message"></div>

  </div>

  <!-- AUDIO PLAYER -->
  <audio id="songPlayer"></audio>

  <script>

    /*
      PUT ALL MP3 FILES
      IN THE SAME FOLDER
      AS THIS HTML FILE
    */

    const songs = [

      {
        answer:"KILL THIS LOVE",
        file:"KTL.mp3"
      },

      {
        answer:"PARTY 4 U",
        file:"P4U.mp3"
      },

      {
        answer:"DAMN RIGHT",
        file:"DR.mp3"
      },

      {
        answer:"MANCHILD",
        file:"MC.mp3"
      },

      {
        answer:"RISK IT ALL",
        file:"RIA.mp3"
      },

      {
        answer:"BACKBURNER",
        file:"BB.mp3"
      },

      {
        answer:"ALMOST IS NEVER ENOUGH",
        file:"AINE.mp3"
      }

    ];

    let currentSong = 0;

    let countdown;

    const player = document.getElementById("songPlayer");

    const timer = document.getElementById("timer");

    const roundText = document.getElementById("roundText");

    const answerInput = document.getElementById("answerInput");

    const message = document.getElementById("message");

    function loadSong(){

      clearInterval(countdown);

      player.pause();

      const song = songs[currentSong];

      roundText.innerText =
      `ROUND ${currentSong + 1} / ${songs.length}`;

      answerInput.value = "";

      message.innerText = "";

      player.src = song.file;

      player.load();

      timer.innerText = "PRESS PLAY";
    }

    function playCurrentSong(){

      clearInterval(countdown);

      player.pause();

      player.currentTime = 0;

      player.play();

      let timeLeft = 10;

      timer.innerText = `${timeLeft}s`;

      countdown = setInterval(() => {

        timeLeft--;

        timer.innerText = `${timeLeft}s`;

        if(timeLeft <= 0){

          clearInterval(countdown);

          player.pause();

          timer.innerText = "TIME'S UP";
        }

      }, 1000);

      setTimeout(() => {

        player.pause();

      }, 20000);
    }

    function checkAnswer(){

      const userAnswer =
      answerInput.value.trim().toUpperCase();

      const correctAnswer =
      songs[currentSong].answer.toUpperCase();

      if(userAnswer === correctAnswer){

        message.innerText = "CORRECT!";

        clearInterval(countdown);

        player.pause();

        currentSong++;

        if(currentSong < songs.length){

          setTimeout(loadSong, 1200);

        }else{

          setTimeout(() => {

            alert("YOU FINISHED GAME 2!");

            window.location.href = "flappybird.html";

          }, 1200);
        }

      }else{

        message.innerText = "WRONG! TRY AGAIN!";
      }
    }

    loadSong();

  </script>

</body>
</html>
