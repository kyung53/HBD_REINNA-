<!-- FILE NAME: flappybird.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Flappy Bird Challenge</title>

  <!-- ARCADE FONT -->
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{

      min-height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;

      overflow:hidden;

      padding:20px;

      font-family:'VT323', monospace;

      background:
      radial-gradient(circle at top, #2563eb 0%, #0f172a 55%, #020617 100%);

      color:white;

      position:relative;
    }

    /* RETRO GRID */
    body::before{

      content:"";

      position:fixed;
      inset:0;

      background-image:
      linear-gradient(rgba(96,165,250,0.12) 1px, transparent 1px),
      linear-gradient(90deg, rgba(96,165,250,0.12) 1px, transparent 1px);

      background-size:40px 40px;

      z-index:0;
    }

    .container{

      position:relative;
      z-index:1;

      width:min(95vw, 900px);

      text-align:center;
    }

    h1{

      font-size:clamp(2.5rem, 6vw, 5rem);

      color:#93c5fd;

      margin-bottom:10px;

      text-shadow:
      4px 4px #1d4ed8,
      0 0 18px rgba(147,197,253,0.9);
    }

    .subtitle{

      font-size:clamp(1.3rem, 2vw, 2rem);

      color:#dbeafe;

      margin-bottom:20px;
    }

    #playBtn{

      padding:14px 35px;

      margin-bottom:20px;

      border:none;

      cursor:pointer;

      background:#2563eb;

      color:white;

      border:3px solid #93c5fd;

      font-family:'VT323', monospace;

      font-size:clamp(1.3rem, 2vw, 1.8rem);

      transition:0.25s;
    }

    #playBtn:hover{

      transform:scale(1.05);

      background:#3b82f6;
    }

    .score{

      font-size:clamp(1.5rem, 2vw, 2.2rem);

      color:#60a5fa;

      margin-bottom:20px;
    }

    canvas{

      width:100%;
      max-width:900px;

      height:auto;

      border:4px solid #60a5fa;

      background:#0f172a;

      box-shadow:
      0 0 12px #60a5fa,
      0 0 35px rgba(96,165,250,0.7);
    }

    .instructions{

      margin-top:20px;

      font-size:clamp(1.2rem, 2vw, 1.7rem);

      color:#dbeafe;
    }

    /* LETTER */

    .letter-overlay{

      position:fixed;

      inset:0;

      background:rgba(0,0,0,0.75);

      display:none;

      justify-content:center;
      align-items:center;

      z-index:999;
    }

    .letter{

      width:min(90vw, 600px);

      background:#071329;

      border:4px solid #60a5fa;

      padding:40px 30px;

      text-align:center;

      box-shadow:
      0 0 15px #60a5fa,
      0 0 35px rgba(96,165,250,0.8);
    }

    .letter h2{

      font-size:clamp(2rem, 5vw, 4rem);

      color:#93c5fd;

      margin-bottom:25px;
    }

    .letter p{

      font-size:clamp(1.4rem, 2vw, 2rem);

      line-height:1.5;

      color:#dbeafe;

      margin-bottom:30px;
    }

    .letter button{

      padding:15px 35px;

      border:none;

      cursor:pointer;

      background:#2563eb;

      color:white;

      border:3px solid #93c5fd;

      font-family:'VT323', monospace;

      font-size:clamp(1.3rem, 2vw, 1.8rem);

      transition:0.25s;
    }

    .letter button:hover{

      transform:scale(1.05);

      background:#3b82f6;
    }

  </style>
</head>

<body>

  <div class="container">

    <h1>FLAPPY RAI</h1>

    <div class="subtitle">
      EARN 7 POINTS TO WIN
    </div>

    <!-- PLAY BUTTON -->
    <button id="playBtn" onclick="startGame()">
      ▶ PLAY GAME
    </button>

    <div class="score" id="scoreText">
      SCORE: 0
    </div>

    <canvas id="gameCanvas" width="900" height="500"></canvas>

    <div class="instructions">
      CLICK SCREEN OR PRESS SPACEBAR TO FLY
    </div>

  </div>

  <!-- LETTER -->
  <div class="letter-overlay" id="letterOverlay">

    <div class="letter">

      <h2>CONGRATULATIONS!</h2>

      <p>
        Congratulations on winning the game!<br><br>
        Are you ready to claim your prize?
      </p>

      <button onclick="goToPrize()">
        CLAIM PRIZE
      </button>

    </div>

  </div>

  <script>

    /*
    ===========================================
    ADD YOUR JPG/PNG FILES
    IN THE SAME FOLDER
    AS THIS HTML FILE
    ===========================================

    Example:

    flappybird.html
    bird.jpg
    pipe.jpg

    OR

    bird.png
    pipe.png

    ===========================================
    CHANGE THE FILE NAMES BELOW
    IF YOUR FILE NAME IS DIFFERENT
    ===========================================
    */

    const birdImage = new Image();
    birdImage.src = "bird.png";

    const pipeImage = new Image();
    pipeImage.src = "pipes.png";

    /*
    ===========================================
    GAME
    ===========================================
    */

    const canvas =
    document.getElementById("gameCanvas");

    const ctx =
    canvas.getContext("2d");

    const scoreText =
    document.getElementById("scoreText");

    const letterOverlay =
    document.getElementById("letterOverlay");

    let score = 0;

    let gameOver = false;

    let gameStarted = false;

    /* BIRD */

    const bird = {

      x:150,
      y:200,

      width:55,
      height:55,

      velocity:0,

      gravity:0.35,

      jump:-7
    };

    /* PIPES */

    let pipes = [];

    function createPipe(){

      const gap = 230;

      const topHeight =
      Math.random() * 160 + 50;

      pipes.push({

        x:canvas.width,

        width:80,

        top:topHeight,

        bottom:topHeight + gap,

        passed:false
      });
    }

    setInterval(() => {

      if(gameStarted && !gameOver){

        createPipe();
      }

    }, 2000);

    /* START GAME */

    function startGame(){

      gameStarted = true;

      document.getElementById("playBtn").style.display = "none";
    }

    /* CONTROLS */

    function flap(){

      if(!gameStarted) return;

      if(!gameOver){

        bird.velocity = bird.jump;
      }
    }

    document.addEventListener("keydown", (e) => {

      if(e.code === "Space"){

        flap();
      }
    });

    canvas.addEventListener("click", flap);

    /* UPDATE */

    function update(){

      if(!gameStarted) return;

      if(gameOver) return;

      bird.velocity += bird.gravity;

      bird.y += bird.velocity;

      /* FLOOR / CEILING */

      if(
        bird.y < 0 ||
        bird.y + bird.height > canvas.height
      ){

        restartGame();
      }

      pipes.forEach(pipe => {

        pipe.x -= 2.5;

        /* SCORE */

        if(
          !pipe.passed &&
          pipe.x + pipe.width < bird.x
        ){

          pipe.passed = true;

          score++;

          scoreText.innerText =
          `SCORE: ${score}`;

          /* WIN */

          if(score >= 7){

            winGame();
          }
        }

        /* COLLISION */

        if(

          bird.x < pipe.x + pipe.width &&
          bird.x + bird.width > pipe.x &&
          (
            bird.y < pipe.top ||
            bird.y + bird.height > pipe.bottom
          )

        ){

          restartGame();
        }

      });

      pipes =
      pipes.filter(pipe => pipe.x + pipe.width > 0);
    }

    /* DRAW */

    function draw(){

      ctx.clearRect(0,0,canvas.width,canvas.height);

      /* BIRD IMAGE */

      ctx.drawImage(
        birdImage,
        bird.x,
        bird.y,
        bird.width,
        bird.height
      );

      /* PIPE IMAGE */

      pipes.forEach(pipe => {

        /* TOP PIPE */

        ctx.drawImage(
          pipeImage,
          pipe.x,
          0,
          pipe.width,
          pipe.top
        );

        /* BOTTOM PIPE */

        ctx.drawImage(
          pipeImage,
          pipe.x,
          pipe.bottom,
          pipe.width,
          canvas.height - pipe.bottom
        );

      });
    }

    /* LOOP */

    function loop(){

      update();

      draw();

      requestAnimationFrame(loop);
    }

    loop();

    /* RESTART */

    function restartGame(){

      score = 0;

      pipes = [];

      bird.y = 200;

      bird.velocity = 0;

      scoreText.innerText =
      "SCORE: 0";
    }

    /* WIN */

    function winGame(){

      gameOver = true;

      letterOverlay.style.display = "flex";
    }

    /* REDIRECT */

    function goToPrize(){

      /*
      ===========================================
      CHANGE THIS LINK
      TO YOUR OTHER WEBSITE
      ===========================================
      */

      window.location.href =
      "reward.html";
    }

  </script>

</body>
</html>
